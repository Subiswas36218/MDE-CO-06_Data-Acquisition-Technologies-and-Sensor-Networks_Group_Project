[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-parking-monitor"
version = "1.0.0"
description = "Python serial acquisition and analysis for a three-slot Arduino parking monitor"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "pandas>=2.0",
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
